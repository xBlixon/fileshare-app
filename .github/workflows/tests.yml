name: tests

on: push

permissions:
  contents: read

env:
  node-version: '24'
  node-cache: 'npm'

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    env:
      APP_ENV: testing
      APP_URL: "http://127.0.0.1:8000"
      DB_DATABASE: database/dusk.sqlite
      MAIL_MAILER: log

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: PHP Setup
        uses: "./.github/actions/php-setup"
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.node-version }}
          cache: ${{ env.node-cache }}

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Set APP_ENV to ${{ env.APP_ENV }}
        uses: './.github/actions/set-env-var'
        with:
          file: .env
          key: APP_ENV
          value: ${{ env.APP_ENV }}

      - name: Setup Dusk .env Configuration
        uses: './.github/actions/dusk-env'
        with:
          APP_ENV: ${{ env.APP_ENV }} # https://laravel.com/docs/13.x/dusk#environment-handling
          APP_URL: ${{ env.APP_URL }}
          DB_DATABASE: ${{ env.DB_DATABASE }}
          MAIL_MAILER: ${{ env.MAIL_MAILER }}

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      - name: Start Chrome Driver
        run: ./vendor/laravel/dusk/bin/chromedriver-linux --port=9515 &

      - name: Run Laravel Server
        run: php artisan serve --no-reload --env=dusk.${{ env.APP_ENV }} &

      - name: Run Dusk Tests
        run: php artisan dusk

      - name: Dump logs
        uses: './.github/actions/show-logs'
